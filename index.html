<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* Estilo para o fundo Matrix */
        body {
            background-color: #000; /* Fundo preto */
            margin: 0;
            padding: 0;
            overflow: hidden; /* Esconde barras de rolagem */
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Coloca o canvas atrás de todo o conteúdo */
        }

        /* Estilo para o conteúdo principal */
        .content {
            font-family: sans-serif;
            text-align: center;
            color: #fff; /* Cor do texto branca para contrastar */
            position: relative;
            z-index: 1;
            padding-top: 50px;
        }

        .content h1 {
            color: #0f0; /* Cor do nome verde, estilo Matrix */
            text-shadow: 0 0 5px #0f0;
        }

        .social-icons a {
            font-size: 30px;
            color: #fff; /* Cor dos ícones branca */
            margin: 0 15px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .social-icons a:hover {
            color: #0f0; /* Cor ao passar o mouse verde */
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="content">
        <h1>SEU NOME COMPLETO AQUI</h1>

        <p>Esse é meu primeiro site publicado com GitHub Pages 💅</p>

        <div class="social-icons">
            <a href="https://www.linkedin.com/in/SEU_PERFIL_AQUI" target="_blank">
                <i class="fa-brands fa-linkedin"></i>
            </a>

            <a href="https://www.instagram.com/SEU_USUARIO_AQUI" target="_blank">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
    </div>
