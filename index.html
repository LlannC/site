<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* CSS para estilizar a página */
        body {
            font-family: sans-serif;
            text-align: center; /* Centraliza todo o texto */
            margin-top: 50px;
        }
        .social-icons a {
            font-size: 30px; /* Tamanho dos ícones */
            color: #333; /* Cor dos ícones */
            margin: 0 15px; /* Espaçamento entre os ícones */
            text-decoration: none; /* Remove o sublinhado dos links */
        }
        .social-icons a:hover {
            color: #0077b5; /* Cor ao passar o mouse (um azul tipo LinkedIn) */
        }
    </style>
</head>
<body>

    <h1>SEU NOME COMPLETO AQUI</h1>

    <p>Esse é meu primeiro site publicado com GitHub Pages 💅</p>

    <div class="social-icons">
        <a href="URL_DO_SEU_LINKEDIN" target="_blank">
            <i class="fa-brands fa-linkedin"></i>
        </a>

        <a href="URL_DO_SEU_INSTAGRAM" target="_blank">
            <i class="fa-brands fa-instagram"></i>
        </a>
    </div>

</body>
</html>
